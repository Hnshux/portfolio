<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Get in Touch</h2>
        <p>Drop us a message and we'll get back to you shortly.</p>
        
        <form id="contactForm" novalidate>
            <div class="input-group">
                <input type="text" id="name" required placeholder=" ">
                <label for="name">Full Name</label>
                <span class="error-message" id="nameError">Name is required</span>
            </div>

            <div class="input-group">
                <input type="email" id="email" required placeholder=" ">
                <label for="email">Email Address</label>
                <span class="error-message" id="emailError">Please enter a valid email</span>
            </div>

            <div class="input-group">
                <textarea id="message" required placeholder=" " rows="5"></textarea>
                <label for="message">Your Message</label>
                <span class="error-message" id="messageError">Message cannot be empty</span>
            </div>

            <button type="submit" id="submitBtn">
                <span>Send Message</span>
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
